<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('portfolio-theme'); } catch {}
        document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
          ? theme : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/brain.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jack Dohrn — Neural Engineering student at UIUC. Selected projects in neural interfaces, electrophysiology, machine learning, and assistive technology." />
    <title>Jack Dohrn | Neural Engineering</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
